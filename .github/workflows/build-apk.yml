name: Build NUTRIA APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'NUTRIA_Android/**'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NUTRIA_Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nutria-debug-apk
          path: NUTRIA_Android/app/build/outputs/apk/debug/app-debug.apk
